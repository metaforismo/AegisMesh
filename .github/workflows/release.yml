# Release pipeline for tagged builds.
#
# Triggers ONLY on tags matching v* (e.g. v0.1.0). Produces:
#   - static binaries for linux/darwin × amd64/arm64
#   - SHA256SUMS.txt over all artifacts
#   - CycloneDX SBOM (anchore/sbom-action)
#   - SLSA build provenance attestation (actions/attest-build-provenance)
#
# All actions pinned by commit SHA; permissions are job-scoped and minimal.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: gate on tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write     # required by attest-build-provenance
      attestations: write # required to store the attestation
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          out="dist/aegismesh-${GOOS}-${GOARCH}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/metaforismo/aegismesh/internal/version.Version=${GITHUB_REF_NAME}" \
            -o "$out" ./cmd/aegismesh

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: sbom-aegismesh-${{ matrix.goos }}-${{ matrix.goarch }}.cdx.json
          upload-artifact: false
          output-file: dist/sbom-aegismesh-${{ matrix.goos }}-${{ matrix.goarch }}.cdx.json

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/aegismesh-*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aegismesh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release + checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release with artifacts
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist

      - name: generate checksums
        run: |
          cd dist
          sha256sum aegismesh-* *sbom*.json > SHA256SUMS.txt

      - name: publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
