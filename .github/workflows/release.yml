# Release pipeline for tagged builds.
#
# Triggers ONLY on tags matching v* (e.g. v0.1.0). Produces four static
# binaries, one application SBOM per target, exact SHA256SUMS.txt, and binary
# build-provenance attestations. All actions are pinned by commit SHA.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: gate on tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: lint
        run: make lint

      - name: tests with race detector
        run: make test

      - name: fuzz seeds
        run: make fuzz-seed

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'v4.2.2'

      - name: Helm chart contract
        run: make helm-contract

      - name: verify module graph
        run: GOTOOLCHAIN=local go mod verify

      - name: pinned vulnerability scan
        run: make vuln

      - name: dependency license policy
        run: make license-check

      - name: secret scan
        run: make secrets-scan

      - name: immutable reference checker
        run: make supply-chain-check

      - name: immutable reference fixtures
        run: ./scripts/check-supply-chain_test.sh

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: download and verify modules
        run: GOTOOLCHAIN=local go mod download && GOTOOLCHAIN=local go mod verify

      - name: exact offline static build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          out="dist/aegismesh-${GOOS}-${GOARCH}"
          GOTOOLCHAIN=local GOPROXY=off GOFLAGS=-mod=readonly CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/metaforismo/aegismesh/internal/version.Version=${GITHUB_REF_NAME}" \
            -o "$out" ./cmd/aegismesh
          test -s "$out"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/aegismesh-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  sbom:
    name: SBOM ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: generate and validate platform SBOM
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          out="dist/sbom-aegismesh-${GOOS}-${GOARCH}.cdx.json"
          GOTOOLCHAIN=local ./scripts/sbom.sh "$out"
          GOTOOLCHAIN=local GOFLAGS=-mod=readonly go run ./tools/sbomcheck "$out"
          test -s "$out"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/sbom-aegismesh-${{ matrix.goos }}-${{ matrix.goarch }}.cdx.json
          if-no-files-found: error

  attest:
    name: attest ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/aegismesh-${{ matrix.goos }}-${{ matrix.goarch }}

  publish:
    name: publish release + checksums
    needs: [attest, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release with artifacts
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-linux-amd64
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-linux-arm64
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-darwin-amd64
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-darwin-arm64
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-linux-amd64
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-linux-arm64
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-darwin-amd64
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-darwin-arm64
          path: dist

      - name: assert exact release artifacts
        run: |
          set -eu
          test -s dist/aegismesh-linux-amd64
          test -s dist/aegismesh-linux-arm64
          test -s dist/aegismesh-darwin-amd64
          test -s dist/aegismesh-darwin-arm64
          test -s dist/sbom-aegismesh-linux-amd64.cdx.json
          test -s dist/sbom-aegismesh-linux-arm64.cdx.json
          test -s dist/sbom-aegismesh-darwin-amd64.cdx.json
          test -s dist/sbom-aegismesh-darwin-arm64.cdx.json

      - name: generate exact SHA256SUMS.txt
        run: |
          cd dist
          sha256sum \
            aegismesh-linux-amd64 \
            aegismesh-linux-arm64 \
            aegismesh-darwin-amd64 \
            aegismesh-darwin-arm64 \
            sbom-aegismesh-linux-amd64.cdx.json \
            sbom-aegismesh-linux-arm64.cdx.json \
            sbom-aegismesh-darwin-amd64.cdx.json \
            sbom-aegismesh-darwin-arm64.cdx.json \
            > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: publish GitHub release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          files: |
            dist/aegismesh-linux-amd64
            dist/aegismesh-linux-arm64
            dist/aegismesh-darwin-amd64
            dist/aegismesh-darwin-arm64
            dist/sbom-aegismesh-linux-amd64.cdx.json
            dist/sbom-aegismesh-linux-arm64.cdx.json
            dist/sbom-aegismesh-darwin-amd64.cdx.json
            dist/sbom-aegismesh-darwin-arm64.cdx.json
            dist/SHA256SUMS.txt
          generate_release_notes: true
