name: codex-encryption-publish

on:
  push:
    branches:
      - codex/evidence-at-rest-age

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      tree: ${{ steps.tree.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Apply reviewed patch to current master
        run: |
          set -eu
          cp .codex/aegismesh-encryption.patch "$RUNNER_TEMP/encryption.patch"
          grep -q '^diff --git ' "$RUNNER_TEMP/encryption.patch"
          git fetch --no-tags origin master
          git reset --hard origin/master
          git apply --index --whitespace=error-all "$RUNNER_TEMP/encryption.patch"
          git diff --cached --check
          grep -q 'filippo.io/age' go.mod
          grep -Rqs 'jsonl.age' internal
          test ! -e .codex/aegismesh-encryption.patch
          test ! -e .github/workflows/codex-encryption-publish.yml
      - name: Record exact tree
        id: tree
        run: echo "sha=$(git write-tree)" >> "$GITHUB_OUTPUT"
      - name: Archive exact candidate tree
        run: tar --exclude=.git -czf "$RUNNER_TEMP/candidate.tgz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: encryption-candidate-tree
          path: ${{ runner.temp }}/candidate.tgz
          if-no-files-found: error
          retention-days: 1

  full:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.0
        with:
          name: encryption-candidate-tree
      - run: mkdir src && tar -xzf candidate.tgz -C src
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
      - run: cd src && make lint test
      - run: |
          cd src
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/aegismesh
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/aegismesh
          rm -f aegismesh

  fuzz:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.0
        with: { name: encryption-candidate-tree }
      - run: mkdir src && tar -xzf candidate.tgz -C src
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: src/go.mod }
      - run: cd src && make fuzz-seed

  helm:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.0
        with: { name: encryption-candidate-tree }
      - run: mkdir src && tar -xzf candidate.tgz -C src
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: { version: v4.2.2 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: src/go.mod }
      - run: cd src && make helm-contract

  vuln:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.0
        with: { name: encryption-candidate-tree }
      - run: mkdir src && tar -xzf candidate.tgz -C src
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: src/go.mod }
      - run: cd src && make vuln

  dependencies:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.0
        with: { name: encryption-candidate-tree }
      - run: mkdir src && tar -xzf candidate.tgz -C src
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: src/go.mod }
      - run: cd src && make license-check secrets-scan && go mod verify

  supply-chain:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.0
        with: { name: encryption-candidate-tree }
      - run: mkdir src && tar -xzf candidate.tgz -C src
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: src/go.mod }
      - run: cd src && make supply-chain-check && make sbom sbom-check

  publish-and-merge:
    needs: [prepare, full, fuzz, helm, vuln, dependencies, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Publish exact verified tree to clean branch
        id: publish
        env:
          EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
        run: |
          set -eu
          cp .codex/aegismesh-encryption.patch "$RUNNER_TEMP/encryption.patch"
          git fetch --no-tags origin master
          git reset --hard origin/master
          git apply --index --whitespace=error-all "$RUNNER_TEMP/encryption.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_DATE='2026-09-01T00:00:00Z' GIT_COMMITTER_DATE='2026-09-01T00:00:00Z' \
            git commit -m 'feat(storage): encrypt evidence segments with age' \
              -m 'Add X25519-only key references and independently authenticated bounded evidence frames. Preserve the disabled plaintext path, mixed-history reads, retention, restart recovery, and fail-closed CLI behavior without adding egress or execution.'
          sha=$(git rev-parse HEAD)
          git push --force origin HEAD:codex/evidence-at-rest-age-final
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Wait for connector-created exact-head pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -eu
          deadline=$((SECONDS+1200))
          pr=''
          while [ "$SECONDS" -lt "$deadline" ]; do
            pr=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=metaforismo:codex/evidence-at-rest-age-final&base=master" --jq '.[0].number' 2>/dev/null || true)
            [ -n "$pr" ] && break
            sleep 10
          done
          test -n "$pr"
          current=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.sha')
          test "$current" = "$HEAD_SHA"
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      - name: Wait for normal exact-SHA CI
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -eu
          deadline=$((SECONDS+1500))
          run_id=''
          while [ "$SECONDS" -lt "$deadline" ]; do
            run_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=30" --jq '.workflow_runs[] | select(.name == "ci") | .id' | head -1)
            if [ -n "$run_id" ]; then
              status=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
              [ "$status" = completed ] && break
            fi
            sleep 15
          done
          test -n "$run_id"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" | python3 -c '
import json, sys
expected = {
    "fmt, vet, build, test (-race)",
    "fuzz seeds (bounded)",
    "helm chart contract",
    "govulncheck",
    "dependency licenses + secret scan",
    "supply-chain contracts",
}
seen = {j["name"]: j.get("conclusion") for j in json.load(sys.stdin).get("jobs", [])}
missing = expected - seen.keys()
bad = {k: seen.get(k) for k in expected if seen.get(k) != "success"}
if missing or bad:
    raise SystemExit(f"exact-SHA CI failed: missing={sorted(missing)} bad={bad}")
'
      - name: Merge and clean temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.publish.outputs.sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -eu
          current=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          test "$current" = "$HEAD_SHA"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
          stale=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=metaforismo:codex/evidence-at-rest-age" --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$stale" ] && [ "$stale" != "$PR_NUMBER" ]; then
            gh pr close "$stale" --repo "$GITHUB_REPOSITORY" --comment 'Superseded by the exact-tree encryption PR.'
          fi
          gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/codex/evidence-at-rest-age-final" || true
          gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/codex/evidence-at-rest-age" || true
