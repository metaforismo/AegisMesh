name: codex-promote-v02-audit

on:
  push:
    branches:
      - codex/v02-audit-promote

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Validate audit PR and exact base
        id: boundary
        run: |
          set -euo pipefail
          prs=$(gh api "repos/$REPO/pulls?state=open&head=metaforismo:codex/v02-release-readiness-v2&per_page=10")
          test "$(jq length <<<"$prs")" -eq 1
          pr=$(jq -r '.[0].number' <<<"$prs")
          pr_json=$(jq '.[0]' <<<"$prs")
          test "$(jq -r .draft <<<"$pr_json")" = true
          test "$(jq -r .base.ref <<<"$pr_json")" = master
          head_sha=$(jq -r .head.sha <<<"$pr_json")
          base_sha=$(jq -r .base.sha <<<"$pr_json")
          current_master=$(gh api "repos/$REPO/branches/master" --jq .commit.sha)
          test "$base_sha" = "$current_master"

          files=$(gh api --paginate "repos/$REPO/pulls/$pr/files?per_page=100" --jq '.[].filename')
          test -n "$files"
          if grep -Eq '^\.codex/|^\.github/workflows/codex-' <<<"$files"; then
            echo 'temporary transport file present in audit PR' >&2
            exit 1
          fi
          unexpected=$(grep -Ev '^(docs/|CHANGELOG\.md$)' <<<"$files" || true)
          test -z "$unexpected"
          grep -qx 'docs/releases/v0.2-readiness.md' <<<"$files"

          encoded=$(gh api "repos/$REPO/contents/docs/releases/v0.2-readiness.md?ref=$head_sha" --jq .content)
          report=$(base64 --decode <<<"$encoded")
          audited=$(sed -n 's/^Audited `master` commit: `\([0-9a-f]\{40\}\)`$/\1/p' <<<"$report")
          test "$audited" = "$base_sha"
          grep -q '^\*\*PASS\*\* — the v0.2 single-node milestone' <<<"$report"
          grep -q '| Git tag | NOT RUN |' <<<"$report"
          grep -q '| New runtime egress | NOT RUN |' <<<"$report"

          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_tree=$(gh api "repos/$REPO/git/commits/$head_sha" --jq .tree.sha)" >> "$GITHUB_OUTPUT"
      - name: Wait for exact-head CI
        id: ci
        env:
          HEAD_SHA: ${{ steps.boundary.outputs.head_sha }}
        run: |
          set -euo pipefail
          required=$(printf '%s\n' \
            'fmt, vet, build, test (-race)' \
            'fuzz seeds (bounded)' \
            'helm chart contract' \
            'govulncheck' \
            'dependency licenses + secret scan' \
            'supply-chain contracts' | sort)
          run_id=''
          for _ in $(seq 1 240); do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=50")
            run_id=$(jq -r --arg sha "$HEAD_SHA" '.workflow_runs[] | select(.name == "ci" and .head_sha == $sha) | .id' <<<"$runs" | head -n1)
            if [ -n "$run_id" ]; then
              state=$(gh api "repos/$REPO/actions/runs/$run_id")
              status=$(jq -r .status <<<"$state")
              conclusion=$(jq -r '.conclusion // ""' <<<"$state")
              if [ "$status" = completed ]; then
                test "$conclusion" = success
                break
              fi
            fi
            sleep 10
          done
          test -n "$run_id"
          jobs=$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100")
          actual=$(jq -r '.jobs[] | select(.conclusion == "success") | .name' <<<"$jobs" | sort)
          test "$actual" = "$required"
          test "$(jq '[.jobs[] | select(.conclusion != "success")] | length' <<<"$jobs")" -eq 0
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Merge exact audit head
        id: merge
        env:
          PR: ${{ steps.boundary.outputs.pr }}
          HEAD_SHA: ${{ steps.boundary.outputs.head_sha }}
          RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          set -euo pipefail
          gh pr ready "$PR" --repo "$REPO"
          gh pr comment "$PR" --repo "$REPO" --body "v0.2 audit promotion PASS for \`$HEAD_SHA\`: the audited base matches current master, the diff is documentation-only and all six CI jobs succeeded in run \`$RUN_ID\`."
          result=$(jq -n --arg sha "$HEAD_SHA" '{sha:$sha,merge_method:"squash",commit_title:"docs(release): record v0.2 readiness audit",commit_message:"Record the complete technical gate matrix, close the finite v0.2 backlog and preserve every unexecuted publication, cluster, signing and egress boundary."}' \
            | gh api --method PUT "repos/$REPO/pulls/$PR/merge" --input -)
          test "$(jq -r .merged <<<"$result")" = true
          echo "merge_sha=$(jq -r .sha <<<"$result")" >> "$GITHUB_OUTPUT"
      - name: Verify tested tree reached master
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          HEAD_TREE: ${{ steps.boundary.outputs.head_tree }}
        run: |
          set -euo pipefail
          master_sha=$(gh api "repos/$REPO/branches/master" --jq .commit.sha)
          test "$master_sha" = "$MERGE_SHA"
          master_tree=$(gh api "repos/$REPO/git/commits/$MERGE_SHA" --jq .tree.sha)
          test "$master_tree" = "$HEAD_TREE"
      - name: Clean integrated branches
        run: |
          set -euo pipefail
          for branch in \
            codex/v02-release-readiness-v2 \
            codex/v02-release-audit \
            codex/v02-truth-sync \
            codex/storage-event-cap \
            codex/evidence-at-rest-age \
            codex/evidence-at-rest-age-review \
            codex/evidence-at-rest-age-v1 \
            codex/evidence-encryption-promote \
            codex/evidence-encryption-promote-v2; do
            encoded=${branch//\//%2F}
            gh api --method DELETE "repos/$REPO/git/refs/heads/$encoded" >/dev/null 2>&1 || true
          done
          encoded=${GITHUB_REF_NAME//\//%2F}
          gh api --method DELETE "repos/$REPO/git/refs/heads/$encoded" >/dev/null 2>&1 || true
