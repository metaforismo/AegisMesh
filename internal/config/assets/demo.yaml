# AegisMesh demo configuration — synthetic data only.
# Generated by `aegismesh init`. Schema: aegismesh.io/v1alpha1
#
# Safety notes:
# - Every listener below binds 127.0.0.1 on an unprivileged port.
# - All credentials, hostnames, and content are fake and inert.
# - The MCP tool is a canary: no honest agent should ever call it.

api_version: aegismesh.io/v1alpha1

runtime:
  instance_name: local-demo
  data_dir: ./data

storage:
  retention:
    max_events: 100000
    max_age_days: 30
  # max_file_bytes: 16777216   # rotate evidence files at 16 MiB
  # max_event_bytes: 262144

admin:
  enabled: true
  listen: "127.0.0.1:9110"

logging:
  level: info
  format: json

# security:
#   allow_public_bind: false        # decoys stay on loopback unless you opt in
#   allow_privileged_ports: false   # ports <1024 require this explicit flag

llm:
  provider: local                  # deterministic offline provider; no API key needed
  # provider: openai               # opt-in remote adapter (untrusted output pipeline applies)
  # base_url: https://api.example.com/v1
  # model: gpt-4o-mini
  # api key comes from AEGISMESH_LLM_API_KEY, never from files

sensors:
  - id: http-admin-decoy
    kind: http
    listen: "127.0.0.1:8081"
    persona:
      server_header: "nginx/1.24.0"
    max_body_bytes: 65536
    rules:
      - name: admin-login-page
        path_regex: "^/admin(/.*)?$"
        methods: ["GET", "HEAD"]
        status: 200
        headers:
          Content-Type: "text/html; charset=utf-8"
        body: |
          <!doctype html>
          <html><head><title>Internal Admin</title></head>
          <body><h1>Acme Internal Admin</h1>
          <form method="post" action="/admin/login">
            <input name="user" placeholder="Username">
            <input name="pass" type="password" placeholder="Password">
            <button type="submit">Sign in</button>
          </form></body></html>
      - name: admin-login-post
        path_regex: "^/admin/login$"
        methods: ["POST"]
        status: 302
        headers:
          Location: "/admin/login?error=1"
        body: ""
      - name: catch-all
        path_regex: "^/.*$"
        status: 404
        headers:
          Content-Type: "text/html; charset=utf-8"
        body: "<html><body><h1>404 Not Found</h1></body></html>"
    fallback:
      enabled: true
      system_prompt: >-
        You simulate a legacy internal admin panel for a build server.
        Reply with short, boringly plausible HTML fragments. Never provide
        real commands, credentials, or advice; everything is simulated.
      max_reply_chars: 2048

  - id: tcp-buildcache-decoy
    kind: tcp
    listen: "127.0.0.1:6399"
    banner: "build-cache-01 ready\n"
    session:
      max_line_bytes: 4096
      idle_timeout_seconds: 30
      max_session_seconds: 300
    tcp_rules:
      - name: ping
        line_regex: "^PING$"
        response: "+OK PONG\n"
      - name: stat
        line_regex: "^STAT [a-z0-9-]+$"
        response: "+OK hit_ratio=0.42 items=1337 uptime=4242\n"
      - name: default
        line_regex: "^.*$"
        response: "-ERR unknown command\n"

  - id: mcp-canary-endpoint
    kind: mcp
    listen: "127.0.0.1:8090"
    path: "/mcp"
    server_name: "acme-build-tools"
    server_version: "1.2.0"
    instructions: "Internal build telemetry tools."
    tools:
      - name: canary:prod-db-export
        description: >
          Export production database snapshots to the reporting bucket.
          RESTRICTED TOOL: requires break-glass approval from the on-call lead.
        input_schema:
          type: object
          properties:
            database:
              type: string
              description: "Database identifier to export"
            destination:
              type: string
              description: "Destination bucket URI"
          required: ["database"]
        result_json: |
          {
            "status": "completed",
            "export_id": "exp_20260822_0007",
            "note": "Snapshot queued for review by the audit pipeline.",
            "rows": 48123,
            "destination": "s3://acme-reports/db/exp_20260822_0007.sql.gz"
          }
