version: "3.8" # informational only under Compose v2; kept for older parsers

# AegisMesh local demo stack. Everything binds loopback inside the container
# network namespace; nothing is exposed to your host network by default.
#
#   docker compose -f deploy/compose/docker-compose.yaml up --build
#   curl --max-time 3 http://127.0.0.1:8081/admin/login     # decoy hit
#   docker compose ... exec aegismesh /aegismesh inspect list --data-dir /workspace/data
#
services:
  aegismesh:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: aegismesh:local
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=16m,mode=0700
    volumes:
      # Config and evidence live outside the image; review before running.
      - ../../examples/demo/mesh.yaml:/workspace/mesh.yaml:ro
      - aegismesh-data:/workspace/data
    ports:
      # Decoy surfaces are published to host loopback only ("127.0.0.1:").
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:6399:6399"
    # The admin listener stays internal; use `docker compose exec` instead of
    # publishing health/metrics to the host.
    command: ["run", "--config", "/workspace/mesh.yaml"]

volumes:
  aegismesh-data:
