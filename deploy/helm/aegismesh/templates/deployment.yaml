apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegismesh.fullname" . }}
  labels:
    {{- include "aegismesh.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "aegismesh.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegismesh.selectorLabels" . | nindent 8 }}
      annotations:
        # Rolling restart whenever the rendered mesh.yaml changes.
        checksum/config: {{ include "aegismesh.meshYaml" . | sha256sum }}
    spec:
      # Nothing in the runtime talks to the Kubernetes API; never project a
      # token into the Pod by default.
      automountServiceAccountToken: false
      {{- $saName := include "aegismesh.fullname" . -}}
      {{- if not .Values.serviceAccount.create -}}
      {{- $saName = required "serviceAccount.create=false requires an explicit non-empty serviceAccount.name naming an account you manage in this namespace" .Values.serviceAccount.name -}}
      {{- end }}
      serviceAccountName: {{ $saName }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: aegismesh
          image: {{ include "aegismesh.image" . | quote }}
          imagePullPolicy: {{ include "aegismesh.pullPolicy" . }}
          # ENTRYPOINT of deploy/Dockerfile is /aegismesh; compose demo passes
          # exactly this argument vector.
          args:
            - run
            - --config
            - /etc/aegismesh/mesh.yaml
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/aegismesh
              readOnly: true
            - name: data
              mountPath: /workspace/data
            - name: tmp
              mountPath: /tmp
          {{ if .Values.probes.enabled }}
          # Exec probes run the binary itself (no shell, curl, or wget exist
          # in the distroless image): the healthcheck subcommand (PR #37)
          # loads this same strict mesh.yaml and GETs the fixed loopback
          # admin path. Probes execute inside the container's own network
          # namespace, so they add no Service/NetworkPolicy exposure.
          livenessProbe:
            exec:
              command:
                - /aegismesh
                - healthcheck
                - --config
                - /etc/aegismesh/mesh.yaml
                - --live
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - /aegismesh
                - healthcheck
                - --config
                - /etc/aegismesh/mesh.yaml
                - --ready
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{ end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "aegismesh.fullname" . }}
            items:
              - key: mesh.yaml
                path: mesh.yaml
        - name: data
          emptyDir: {}
        # Mirrors the compose stack's `tmpfs: /tmp:size=16m` so a read-only
        # root filesystem stays workable without widening it.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
