apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegismesh.fullname" . }}
  labels:
    {{- include "aegismesh.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "aegismesh.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegismesh.selectorLabels" . | nindent 8 }}
      annotations:
        # Rolling restart whenever the rendered mesh.yaml changes.
        checksum/config: {{ include "aegismesh.meshYaml" . | sha256sum }}
    spec:
      # Nothing in the runtime talks to the Kubernetes API; never project a
      # token into the Pod by default.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: aegismesh
          image: {{ include "aegismesh.image" . | quote }}
          imagePullPolicy: {{ include "aegismesh.pullPolicy" . }}
          # ENTRYPOINT of deploy/Dockerfile is /aegismesh; compose demo passes
          # exactly this argument vector.
          args:
            - run
            - --config
            - /etc/aegismesh/mesh.yaml
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/aegismesh
              readOnly: true
            - name: data
              mountPath: /workspace/data
            - name: tmp
              mountPath: /tmp
        # No liveness/readiness probes in this core chart. The admin
        # endpoints (/healthz, /readyz) are real and verified, but
        # admin.listen is loopback-only by validated invariant
        # (internal/config/validate.go), so kubelet probes - which dial the
        # Pod IP - cannot reach them, and the distroless image ships no
        # shell/wget for exec probes. Deferred to the probes PR rather than
        # faking readiness semantics.
      volumes:
        - name: config
          configMap:
            name: {{ include "aegismesh.fullname" . }}
            items:
              - key: mesh.yaml
                path: mesh.yaml
        - name: data
          emptyDir: {}
        # Mirrors the compose stack's `tmpfs: /tmp:size=16m` so a read-only
        # root filesystem stays workable without widening it.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
