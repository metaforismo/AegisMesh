{{/*
Dedicated least-privilege identity for this release (values.serviceAccount).

By construction it grants nothing: this chart creates NO Role, ClusterRole,
RoleBinding, or ClusterRoleBinding because AegisMesh never calls the
Kubernetes API, and automountServiceAccountToken is false so the account can
never hand a projected API token to the Pod (mirrored at pod level as defense
in depth). With serviceAccount.create=false no object is rendered here and
the Deployment references an operator-managed account by name instead.
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegismesh.fullname" . }}
  labels:
    {{- include "aegismesh.labels" . | nindent 4 }}
# Explicit rather than defaulted: the account itself must not project a token.
automountServiceAccountToken: false
{{- end }}
